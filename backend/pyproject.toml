[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "asistente-modular-backend"
version = "0.1.0"
description = "Motor local de Asistente Modular"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "google-genai>=1,<2",
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "edge-tts>=7.3.1,<8",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "python-pptx>=1.0,<2",
  "fpdf2>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
voice-stt = ["faster-whisper>=1.1,<2", "vosk>=0.3.45,<0.4"]

[project.scripts]
asistente-modular-backend = "asistente.api.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]
